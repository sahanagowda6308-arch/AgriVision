<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AgriVision</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
/* ===== CHANGE COLOURS HERE ===== */
:root{
  --bg1:#0f3d2e;      /* page background, top */
  --bg2:#2f7d4f;      /* page background, bottom */
  --card:#f3f8e8;     /* soft leaf-green card (not white) */
  --ink:#1b2a1f;
  --accent:#1f7a3f;
  --accent2:#e0a526;  /* sunflower gold */
}
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;font-family:system-ui,-apple-system,"Noto Sans Kannada",sans-serif;color:var(--ink);
  background:linear-gradient(170deg,var(--bg1),var(--bg2)) fixed;
  /* PICTURE: replace the line above with this (put bg.jpg in the same folder):
     background:linear-gradient(rgba(0,0,0,.35),rgba(0,0,0,.35)),url("bg.jpg") center/cover fixed; */
}
header{padding:22px 16px 6px;text-align:center;color:#fff}
header h1{margin:0;font-size:1.9rem}
header p{margin:4px 0 0;opacity:.85}
main{max-width:560px;margin:12px auto 40px;padding:0 12px}
.card{background:var(--card);border-radius:18px;padding:18px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.page{display:none}.page.on{display:block}
h2{margin:0 0 10px;font-size:1.25rem}
input[type=text]{width:100%;padding:12px;border:2px solid #b9cfa8;border-radius:12px;font-size:1rem;background:#fbfdf5}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:12px 16px;background:var(--accent);color:#fff;margin:6px 6px 0 0}
button.alt{background:transparent;color:var(--accent);border:2px solid var(--accent)}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent2);outline-offset:2px}
#map{height:260px;border-radius:12px;margin-top:10px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.stat{flex:1 1 120px;background:#e3eed0;border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:1.3rem}
.crop{background:linear-gradient(135deg,#2e8b4f,#5fb36b);color:#fff;border-radius:14px;padding:12px 14px;margin-top:12px}
.crop.local{background:linear-gradient(135deg,#8a5a1b,#c68a2c)}
.crop h3{margin:0 0 6px;font-size:1.1rem}
.stages{display:flex;gap:4px;margin:6px 0}
.stages span{flex:1;text-align:center;font-size:.75rem;padding:5px 0;border-radius:8px;background:rgba(255,255,255,.25)}
.stages span:first-child{background:#fff;color:#1b2a1f;font-weight:600}
.fert{font-size:.92rem;margin:6px 2px 0}
.note{font-size:.82rem;opacity:.8;margin-top:12px}
.localbox{background:#fff3d6;border-radius:12px;padding:10px 12px;margin-top:6px}
select{padding:10px;border:2px solid #b9cfa8;border-radius:12px;font:inherit;background:#fbfdf5;width:100%;margin-top:3px}
label{flex:1 1 110px;font-size:.85rem}
.stat b.small{font-size:.95rem}
.langbar{margin-top:8px}
.langbar button{background:transparent;border:2px solid #fff;color:#fff;margin:4px 4px 0;padding:8px 18px}
.langbar button.on{background:#fff;color:#1b2a1f;font-weight:600}
.msg{font-size:.9rem;margin-top:8px;min-height:1.2em}
</style>
</head>
<body>
<header>
  <h1>🌾 AgriVision</h1>
  <p data-t="tagline"></p>
  <div class="langbar"><button id="langEn">English</button><button id="langKn">ಕನ್ನಡ</button></div>
  <p style="font-size:.75rem;opacity:.7">Version 16 · soil levels estimated per location</p>
</header>
<main>

<section class="card page on" id="p1">
  <h2 data-t="h1"></h2>
  <button id="gps" data-t="gps"></button>
  <div style="margin-top:10px"><input type="text" id="q" data-tp="ph_search"></div>
  <button id="search" class="alt" data-t="search"></button>
  <div id="map"></div>
  <div class="msg" id="msg1"></div>
</section>

<section class="card page" id="p2">
  <h2 data-t="h2"></h2>
  <p id="place"></p>
  <div class="row" id="wstats"></div>
  <button class="alt" data-go="1" data-t="back"></button><button data-go="3" data-t="next"></button>
</section>

<section class="card page" id="p3">
  <h2 data-t="h3"></h2>
  <div class="row" id="sstats"></div>
  <p class="msg" id="soilnote"></p>
  <p style="margin:10px 0 2px"><b data-t="sat_title"></b></p>
  <div class="row" id="npkstats"></div>
  <p class="msg" id="npknote"></p>
  <details open style="margin-top:8px"><summary style="cursor:pointer;color:var(--accent)" data-t="card_sum"></summary>
  <p class="note" data-t="card_hint"></p>
  <div class="row">
    <label><span data-t="lN"></span><select id="iN"><option value="" data-t="sel"></option><option value="Low" data-t="Low"></option><option value="Medium" data-t="Medium"></option><option value="High" data-t="High"></option></select></label>
    <label><span data-t="lP"></span><select id="iP"><option value="" data-t="sel"></option><option value="Low" data-t="Low"></option><option value="Medium" data-t="Medium"></option><option value="High" data-t="High"></option></select></label>
    <label><span data-t="lK"></span><select id="iK"><option value="" data-t="sel"></option><option value="Low" data-t="Low"></option><option value="Medium" data-t="Medium"></option><option value="High" data-t="High"></option></select></label>
    <label><span data-t="lPH"></span><input type="text" id="iPH" placeholder="6.5" inputmode="decimal"></label>
  </div>
  </details>
  <button class="alt" data-go="2" data-t="back"></button><button id="showCrops" data-t="showcrops"></button>
</section>

<section class="card page" id="p4">
  <h2 data-t="h4"></h2>
  <div id="line" style="text-align:center"></div>
  <div id="local"></div>
  <div id="results"></div>
  <div style="text-align:center;margin-top:14px">
    <button id="vEn" data-t="vEn"></button><button id="vKn" data-t="vKn"></button>
  </div>
  <p class="note" id="voicenote"></p>
  <p class="note" data-t="fert_note"></p>
  <button class="alt" data-go="3" data-t="back"></button><button id="again" data-t="again"></button>
</section>

</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>

function nearestTaluk(district,lat,lon){
  const list=TALUKS.filter(t=>t.d===district);
  if(!list.length)return null;
  const dist=t=>Math.hypot((t.lat-lat)*111,(t.lon-lon)*111*Math.cos(lat*Math.PI/180));
  return list.map(t=>({t,k:dist(t)})).sort((a,b)=>a.k-b.k)[0].t;
}

  }catch(e){setMsg("m_nonet");}

async function pick(lat,lon){
  S.lat=lat;S.lon=lon;
  if(marker)marker.setLatLng([lat,lon]);else marker=L.marker([lat,lon]).addTo(map);
  map.setView([lat,lon],11);
  setMsg("m_reading");
  try{
    await Promise.all([getPlace(lat,lon),getWeather(lat,lon),getSoil(lat,lon),getAnnual(lat,lon)]);
    S.season=season();
    S.taluk=nearestTaluk(S.district,S.lat,S.lon);
    if(S.country!=="in"){setMsg("m_india");return;}
    S.hidden=[];
    let base;
    if(S.taluk){base=S.taluk.crops;S.areaLabel=S.taluk.n+" taluk, "+title(S.district);}
    else if(S.state==="karnataka"&&LOCAL_CROPS[S.district]){base=LOCAL_CROPS[S.district];S.areaLabel=title(S.district);}
    else{base=STATE_CROPS[S.state]||[];S.areaLabel=S.state?title(S.state):"";}
    S.localList=S.taluk?base:base.filter(n=>{const ok=viableName(n);if(!ok)S.hidden.push(n);return ok;});
    S.loaded=true;
    renderPages();go(2);
  }catch(e){setMsg("m_loadfail");}
}
async function getPlace(lat,lon){
  try{
    const d=await (await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&zoom=10&lat=${lat}&lon=${lon}`)).json();
    const a=d.address||{};
    const name=(a.state_district||a.county||"").toLowerCase().replace(/ district$/,"").trim();
    S.district=ALIAS[name]||name;
    const st=(a.state||"").toLowerCase().trim();
    S.state=STATE_ALIAS[st]||st;
    S.country=(a.country_code||"in").toLowerCase();
    S.place=[a.village||a.town||a.city||a.suburb||"",a.state_district||a.county||"",a.state||""].filter(Boolean).join(", ");
  }catch(e){S.district="";S.place=lat.toFixed(3)+", "+lon.toFixed(3);S.state="";S.country="in";}
}
async function getWeather(lat,lon){
  const u=`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&daily=precipitation_sum,temperature_2m_max,temperature_2m_min,relative_humidity_2m_mean&past_days=23&forecast_days=7&timezone=auto`;
  const d=await (await fetch(u)).json();
  const mx=d.daily.temperature_2m_max,mn=d.daily.temperature_2m_min;
  S.temp=mx.map((v,i)=>(v+mn[i])/2).reduce((a,b)=>a+b)/mx.length;
  const pr=d.daily.precipitation_sum.map(v=>v||0);
  S.rain=pr.slice(-7).reduce((a,b)=>a+b,0);
  S.rain30=pr.reduce((a,b)=>a+b,0);
  const hm=d.daily.relative_humidity_2m_mean.filter(v=>v!=null);
  S.hum=hm.length?hm.reduce((a,b)=>a+b,0)/hm.length:70;
  S.elev=d.elevation;
}
async function getAnnual(lat,lon){
  S.annual=null;
  try{
    const end=new Date(Date.now()-6*864e5),start=new Date(end.getTime()-364*864e5);
    const f=d=>d.toISOString().slice(0,10);
    const u=`https://archive-api.open-meteo.com/v1/archive?latitude=${lat}&longitude=${lon}&start_date=${f(start)}&end_date=${f(end)}&daily=precipitation_sum&timezone=auto`;
    const d=await (await fetch(u)).json();
    S.annual=d.daily.precipitation_sum.reduce((a,b)=>a+(b||0),0);
  }catch(e){S.annual=null;}
}
async function getSoil(lat,lon){
  S.soil="loam";S.soilAuto=false;S.totN=null;S.phVal=null;S.ocPct=null;
  try{
    const c=new AbortController();setTimeout(()=>c.abort(),8000);
    const u=`https://rest.isric.org/soilgrids/v2.0/properties/query?lon=${lon}&lat=${lat}&property=clay&property=sand&property=nitrogen&property=phh2o&property=soc&depth=0-5cm&depth=5-15cm&value=mean`;
    const d=await (await fetch(u,{signal:c.signal})).json();
    const v={};d.properties.layers.forEach(l=>{const m=l.depths.map(x=>x.values.mean).filter(x=>x!=null);v[l.name]=m.length?m.reduce((a,b)=>a+b,0)/m.length/10:null;});
    S.clayPct=v.clay;S.sandPct=v.sand;S.totN=v.nitrogen==null?null:v.nitrogen/10;S.phVal=v.phh2o;S.ocPct=v.soc==null?null:v.soc/10;
    S.soil=v.clay>=35?"clay":(v.sand>=55?"sandy":"loam");S.soilAuto=true;
  }catch(e){}
}
/* Only values that really can be read from satellite soil maps are used: pH and total nitrogen.
   Phosphorus and potassium cannot be found from GPS, so they are not guessed. */
function estimatePH(){return S.phVal!=null?Math.max(4.5,Math.min(8.5,Math.round(S.phVal*10)/10)):6.5;}
const K_LOW_STATES=new Set(["assam","manipur","odisha","tripura","andaman and nicobar islands"]);
function typicalLevels(){return {N:"Low",P:"Low",K:K_LOW_STATES.has(S.state)?"Low":"Medium"};}
/* Best-guess N, P, K levels from soil properties found at the GPS point (not lab measurements):
   N  from organic carbon (the usual soil-card shortcut for nitrogen; limits set so most soils read Low, as national data shows)
   P  from pH (phosphorus is least available in acid or alkaline soil)
   K  from clay content (sandy soils hold little potassium, clay and black soils hold more) */
function estimatedLevels(){
  if(!S.soilAuto||S.ocPct==null||S.phVal==null||S.clayPct==null)return typicalLevels();
  const oc=S.ocPct,ph=estimatePH(),clay=S.clayPct;
  const N=oc<1.2?"Low":(oc<2.0?"Medium":"High");
  const P=(ph>=6.0&&ph<=7.5&&oc>=1.2)?"Medium":"Low";
  let K=clay<15?"Low":(clay<35?"Medium":"High");
  if(K_LOW_STATES.has(S.state)&&K==="High")K="Medium";
  return {N,P,K};
}
function season(){
  const m=new Date().getMonth()+1;
  return m>=6&&m<=9?"kharif":(m>=10||m<=2?"rabi":"summer");
}

/* ===== Scoring: each crop gets a real score, so not everything shows 100% ===== */
function fit(c){
  let tf=1;
  if(S.temp<c.t[0])tf=Math.max(0,1-(c.t[0]-S.temp)/8);
  if(S.temp>c.t[1])tf=Math.max(0,1-(S.temp-c.t[1])/8);
  const sf=c.soil.includes(S.soil)?1:.5;
  const have=S.rain<10?0:(S.rain<40?1:2);
  const wf=1-.3*Math.abs(have-c.w);
  const inSeason=c.s.includes("all")||c.s.includes(S.season);
  let score=(tf*.4+sf*.25+wf*.35)*(inSeason?1:.4);
  if(c.plant&&(S.elev<c.elev[0]||S.elev>c.elev[1]))score*=.4;
  return Math.round(score*100);
}
function perAcre(c){
  const [N,P,K]=c.npk;
  if(c.perTree)return t("fert_tree",(N/.46).toFixed(1),(P/.46).toFixed(1),(K/.6).toFixed(1));
  const dap=P/.46, urea=Math.max(0,(N-dap*.18)/.46), mop=K/.6;
  const a=x=>Math.round(x/2.471);
  return t("fert_acre",a(urea),a(dap),a(mop),N,P,K);
}

const cap=s=>s[0].toUpperCase()+s.slice(1);
const title=s=>s.replace(/\b\w/g,c=>c.toUpperCase());

const nameOf=c=>LANG==="kn"?`${c.kn} (${c.id})`:`${c.id}${S.state==="karnataka"?` (${c.kn})`:""}`;
const modelName=k=>{const e=cap(k);return LANG==="kn"?`${MODEL_KN[k]||e} (${e})`:`${e}${S.state==="karnataka"?` (${MODEL_KN[k]||""})`:""}`;};
const disp=n=>{const c=CROPS.find(x=>x.id===n);return c?(LANG==="kn"?c.kn:c.id):n;};
function renderPages(keep){
  $("place").textContent="📍 "+S.place;
  $("wstats").innerHTML=stat(S.temp.toFixed(1)+" °C",t("l_temp"))+stat(S.rain.toFixed(1)+" mm",t("l_rain7"))+stat(Math.round(S.elev)+" m",t("l_elev"))+(S.annual!=null?stat(Math.round(S.annual)+" mm",t("l_rain12")):"");
  $("sstats").innerHTML=stat(t("soil_"+S.soil),t("l_soil"))+stat(t("season_"+S.season),t("l_season"));
  $("soilnote").textContent=S.soilAuto?t("soilnote_ok",Math.round(S.clayPct),Math.round(S.sandPct)):t("soilnote_no");
  $("vKn").style.display=(LANG==="kn"||S.state==="karnataka")?"":"none";
  fillNPK(keep);
  buildCrops();
}
function fillNPK(keep){
  const tl=estimatedLevels();
  if(!keep)S.userEdited=false;
  $("npkstats").innerHTML=stat(S.phVal!=null?estimatePH():"–",t("l_ph"))+stat(t(tl.N),t("l_nT"))+stat(t(tl.P),t("l_pT"))+stat(t(tl.K),t("l_kT"));
  $("iPH").placeholder=(S.phVal!=null?estimatePH():"6.5")+" (auto)";
  if(!S.userEdited){   // automatic values are filled in; the farmer can still change them
    $("iN").value=tl.N;$("iP").value=tl.P;$("iK").value=tl.K;$("iPH").value="";S.typical=true;
  }
  $("npknote").innerHTML=t(S.soilAuto?"npknote_a_ok":"npknote_a_no")+t("npknote_b")+'<br><button id="useTyp" class="alt">'+t("useTyp")+'</button>';
  $("useTyp").onclick=()=>{S.userEdited=false;fillNPK(true);buildCrops();};
}
["iN","iP","iK"].forEach(id=>$(id).addEventListener("change",()=>{S.userEdited=true;S.typical=false;}));
function card(c,pct,cls){
  const days=c.d?t("days",c.d):t("perennial");
  const stages=c.plant?"":`<div class="stages"><span>${t("st1")}</span><span>${t("st2")}</span><span>${t("st3")}</span><span>${t("st4")}</span></div>`;
  const note=c.note?(LANG==="kn"&&NOTES_KN[c.id]?NOTES_KN[c.id]:c.note):"";
  return `<div class="crop ${cls||""}"><h3>${c.e} ${nameOf(c)} – ${t("match",pct)}</h3>${stages}<div>${days}</div>${note?`<div class="fert">${note}</div>`:""}</div><p class="fert"><b>${perAcre(c)}</b></p>`;
}
function buildCrops(){
  $("line").textContent=t("line",S.temp.toFixed(1),S.rain.toFixed(1),t("season_"+S.season),t("soil_"+S.soil));
  const names=S.localList||[];
  const area=(S.taluk&&LANG==="kn")?S.taluk.n+" ತಾಲ್ಲೂಕು, "+title(S.district):(S.areaLabel||t("yourArea"));
  let html="";
  if(names.length){
    html+=`<div class="localbox"><b>${t("local_head",area)}</b><br>${names.map(disp).join(" · ")}<br><span style="font-size:.8rem;opacity:.75">${t("local_disc")}</span></div>`;
    names.map(n=>CROPS.find(c=>c.id===n)).filter(Boolean).forEach(c=>{html+=card(c,fit(c),"local");});
  }else if(S.elev>=700){
    const hill=CROPS.filter(c=>c.plant&&S.elev>=c.elev[0]&&S.elev<=c.elev[1]).slice(0,2);
    if(hill.length)html+=`<div class="localbox"><b>${t("hill",Math.round(S.elev))}</b></div>`+hill.map(c=>card(c,fit(c),"local")).join("");
  }
  if(S.hidden&&S.hidden.length)html+=`<p class="note" style="color:#1b2a1f">${t("hidden",S.hidden.map(disp).join(", "),area,S.hidden.length>1)}</p>`;
  $("local").innerHTML=html;
  const shown=new Set(names);
  S.top=CROPS.filter(c=>!c.plant&&!shown.has(c.id)).map(c=>({c,p:fit(c)})).sort((a,b)=>b.p-a.p).slice(0,3);
  S.shown=S.top.map(x=>({en:x.c.id,kn:x.c.kn}));
  const rulesHTML=`<h3 style="margin:16px 0 0">${t("best_season",t("season_"+S.season))}</h3>`+S.top.map(x=>card(x.c,x.p)).join("");
  $("results").innerHTML=rulesHTML;
  const N=$("iN").value,P=$("iP").value,K=$("iK").value,phIn=parseFloat($("iPH").value);
  const haveCard=!!(N&&P&&K);
  const base={temperature:S.temp,humidity:S.hum,ph:isNaN(phIn)?estimatePH():phIn,rainfall:S.rain30};
  const job=haveCard?predictCrops({...base,N:LEVEL.N[N],P:LEVEL.P[P],K:LEVEL.K[K]},"full"):predictCrops(base,"gps");
  job.then(top=>{
      S.modelTop=top;
      S.shown=top.map(x=>({en:cap(x.crop),kn:MODEL_KN[x.crop]||cap(x.crop)}));
      const head=haveCard?(S.typical?"m_title_typ":"m_title_card"):"m_title_loc";
      const note=haveCard?(S.typical?"mn_typ":"mn_card"):"mn_gps";
      $("results").innerHTML=`<h3 style="margin:16px 0 0">${t(head)}</h3>`+
        (top[0].score<50?`<p class="note">${t(haveCard?"lowconf_card":"lowconf_gps")}</p>`:"")+
        top.map(x=>`<div class="crop"><h3>${modelName(x.crop)} – ${t("match",x.score)}</h3></div>`).join("")+
        `<p class="note">${t(note)}${t("mn_tail")}</p>`;
    })
    .catch(err=>{$("results").innerHTML=rulesHTML+`<p class="note">${t("model_fail",err.message)}</p>`;});
}

/* Low / Medium / High on the Soil Health Card, converted to the scale of the training data */
const LEVEL={N:{Low:17,Medium:37,High:91},P:{Low:24,Medium:51,High:73},K:{Low:19,Medium:32,High:52}};
const CROP_MODELS={};
async function loadModel(kind){
  if(CROP_MODELS[kind])return CROP_MODELS[kind];
  const bin=atob(MODELS_B64[kind].replace(/\s+/g,""));
  const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));
  const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"));
  CROP_MODELS[kind]=JSON.parse(await new Response(stream).text());
  return CROP_MODELS[kind];
}
async function predictCrops(input,kind){
  const m=await loadModel(kind),row=m.features.map(f=>Number(input[f])),total=new Array(m.classes.length).fill(0);
  for(const tr of m.trees){let n=0;while(tr.l[n]!==-1){n=row[tr.f[n]]<=tr.t[n]?tr.l[n]:tr.r[n];}tr.v[n].forEach((p,i)=>total[i]+=p);}
  return total.map((s,i)=>({crop:m.classes[i],score:Math.round(s/m.trees.length*100)})).filter(x=>viableName(x.crop[0].toUpperCase()+x.crop.slice(1))).sort((a,b)=>b.score-a.score).slice(0,3);
}
$("showCrops").onclick=()=>{buildCrops();go(4);};

/* ===== Voice ===== */
function speak(lang){
  speechSynthesis.cancel();
  const names=S.localList||[];
  const knName=n=>{const c=CROPS.find(x=>x.id===n);return c?c.kn:n;};
  const best=(S.shown||[]).map(x=>lang==="kn"?x.kn:x.en).join(", ");
  let text;
  if(lang==="kn"){
    text=(names.length?`ಈ ಪ್ರದೇಶದಲ್ಲಿ ಸಾಮಾನ್ಯವಾಗಿ ಬೆಳೆಯುವ ಬೆಳೆಗಳು: ${names.map(knName).join(", ")}. `:"")
      +`ನಿಮ್ಮ ಮಣ್ಣಿಗೆ ಸೂಕ್ತ ಬೆಳೆಗಳು: ${best}. ಮಣ್ಣು: ${SOILKN[S.soil]}. ರಸಗೊಬ್ಬರ ಬಳಸುವ ಮೊದಲು ಹತ್ತಿರದ ಕೃಷಿ ವಿಜ್ಞಾನ ಕೇಂದ್ರವನ್ನು ಸಂಪರ್ಕಿಸಿ.`;
  }else{
    text=(names.length?`Commonly grown here: ${names.join(", ")}. `:"")
      +`Best crops for your soil: ${best}. Soil is ${S.soil}. Confirm fertilizer doses with your local Krishi Vigyan Kendra.`;
  }
  $("voicenote").textContent="";
  const vs=speechSynthesis.getVoices?speechSynthesis.getVoices():[];
  if(lang==="kn"&&vs.length&&!vs.some(v=>v.lang.toLowerCase().startsWith("kn")))
    $("voicenote").textContent=t("v_nokn");
  const u=new SpeechSynthesisUtterance(text);u.lang=lang==="kn"?"kn-IN":"en-IN";speechSynthesis.speak(u);
}
$("vEn").onclick=()=>speak("en");
$("vKn").onclick=()=>speak("kn");
$("again").onclick=()=>{speechSynthesis.cancel();setMsg("m_default");go(1);};
$("langEn").onclick=()=>setLang("en");
$("langKn").onclick=()=>setLang("kn");
setMsg("m_default");
applyStatic();
</script>
